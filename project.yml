name: GramMusic
options:
  bundleIdPrefix: com.grammusic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: N5H5JFAU3Q   # baked in so `xcodegen generate` keeps signing
    # Check actor isolation and sendability throughout the app, including task-group closures.
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  # TDLibKit (Swiftgram) — native Swift wrapper over Telegram's TDLib.
  # Resolves a large (~300 MB) xcframework on first open. See README.
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: "1.5.2-tdlib-1.8.64-e0943d06"

  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "10.29.0"

targets:
  GramMusic:
    type: application
    platform: iOS
    sources:
      - path: GramMusic
        excludes:
          # Never ship a TDLib session: it contains live account auth keys.
          - "ReviewerSession.bundle"
          - "ReviewerSession.bundle/**"
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint >/dev/null; then
            swiftlint
          elif [ -f /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint
          elif [ -f /usr/local/bin/swiftlint ]; then
            /usr/local/bin/swiftlint
          fi
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        INFOPLIST_FILE: GramMusic/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.grammusic.player
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: GramMusic/GramMusic.entitlements
        # Telegram credentials are injected from Config/Secrets.xcconfig and
        # surfaced into Info.plist as TelegramApiId / TelegramApiHash.
    dependencies:
      - package: TDLibKit
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - target: GramMusicWidgets

  GramMusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GramMusicWidgets
      - path: GramMusic/Models/WidgetSharedTrack.swift
      - path: GramMusic/Models/WidgetSharedStore.swift
    settings:
      base:
        INFOPLIST_FILE: GramMusicWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.grammusic.player.widgets
        DEVELOPMENT_TEAM: N5H5JFAU3Q
        CODE_SIGN_ENTITLEMENTS: GramMusicWidgets/GramMusicWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO

  GramMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GramMusicTests
    dependencies:
      - target: GramMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.grammusic.tests

  GramMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GramMusicUITests
    dependencies:
      - target: GramMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.grammusic.uitests
        TEST_TARGET_NAME: GramMusic


schemes:
  GramMusic:
    build:
      targets:
        GramMusic: all
        GramMusicWidgets: all
    test:
      targets:
        - GramMusicTests
        - GramMusicUITests


